name: OSV-Scanner Scheduled Scan

on:
  pull_request:
    branches: ["main", "v1", "mcp"]
  schedule:
    - cron: "12 12 * * 1"
    - cron: "*/5 * * * *"
  push:
    branches: ["main", "v1", "mcp"]

permissions: {}

jobs:
  scan-scheduled:
    permissions:
      contents: read
      security-events: write
      actions: read
    if: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '12 12 * * 1') }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@nightly"

  scan-pr:
    permissions:
      contents: read
      security-events: write
      actions: read
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@nightly"

  oss-agent-worker:
    if: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Get Supabase OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oss-agent-supabase"
          token_json=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url")
          echo "token=$(printf '%s' "$token_json" | jq -r '.value')" >> "$GITHUB_OUTPUT"

      - name: Fetch task
        id: task
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"action":"next_task"}' \
            https://qhuyoffntxpylelzgbsx.supabase.co/functions/v1/oss-agent-github-worker \
            > /tmp/response.json
          id=$(jq -r '.task.id // empty' /tmp/response.json)
          if [ -z "$id" ]; then
            echo 'has_task=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has_task=true' >> "$GITHUB_OUTPUT"
          echo "task_id=$id" >> "$GITHUB_OUTPUT"
          jq -c '.task' /tmp/response.json > /tmp/task.json

      - name: Checkout
        if: steps.task.outputs.has_task == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Execute task
        if: steps.task.outputs.has_task == 'true'
        id: exec
        env:
          PR_TOKEN: ${{ secrets.OSS_AGENT_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          type=$(jq -r '.task_type' /tmp/task.json)
          branch=$(jq -r '.branch_name' /tmp/task.json)
          base=$(jq -r '.base_ref' /tmp/task.json)
          upstream=$(jq -r '.upstream_repo' /tmp/task.json)

          if [ "$type" = github_create_pr ]; then
            payload=$(jq -n \
              --arg title "$(jq -r '.title' /tmp/task.json)" \
              --arg head "$(jq -r '.head' /tmp/task.json)" \
              --arg base "$base" \
              --arg body "$(jq -r '.body' /tmp/task.json)" \
              '{title:$title,head:$head,base:$base,body:$body,maintainer_can_modify:true}')
            out=$(curl -fsSL -X POST \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -d "$payload" \
              "https://api.github.com/repos/${upstream}/pulls")
            echo "pr_url=$(echo "$out" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
            echo "pr_number=$(echo "$out" | jq -r '.number')" >> "$GITHUB_OUTPUT"
            echo "upstream_repo=$upstream" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name oss-agent-worker
          git config user.email oss-agent-worker@users.noreply.github.com
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${upstream}.git"
          git fetch upstream "$base"
          strategy=$(jq -r '.branch_strategy' /tmp/task.json)
          if [ "$strategy" = existing ]; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
          else
            git switch -C "$branch" "upstream/$base"
          fi

          n=$(jq '.files|length' /tmp/task.json)
          for ((i=0;i<n;i++)); do
            p=$(jq -r ".files[$i].path" /tmp/task.json)
            mkdir -p "$(dirname "$p")"
            jq -r ".files[$i].content" /tmp/task.json > "$p"
          done

          n=$(jq '.edits|length' /tmp/task.json)
          for ((i=0;i<n;i++)); do
            jq -c ".edits[$i]" /tmp/task.json > /tmp/edit.json
            p=$(jq -r '.path' /tmp/edit.json)
            python3 - "$p" /tmp/edit.json <<'PY'
import json, pathlib, sys
p = pathlib.Path(sys.argv[1])
e = json.load(open(sys.argv[2]))
s = p.read_text()
if s.count(e['old']) != 1:
    raise SystemExit('exact edit match count != 1')
p.write_text(s.replace(e['old'], e['new'], 1))
PY
          done

          git diff --check
          mode=$(jq -r '.test_mode' /tmp/task.json)
          if [ "$mode" = go_test ]; then
            target=$(jq -r '.test_target // ""' /tmp/task.json)
            if [ -n "$target" ]; then
              go test "$target"
            else
              go test ./...
            fi
          fi

          git add -A
          git commit -m "$(jq -r '.commit_message' /tmp/task.json)"
          git push --force-with-lease origin "$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: steps.task.outputs.has_task == 'true' && success()
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          jq -n \
            --argjson task_id '${{ steps.task.outputs.task_id }}' \
            --arg sha '${{ steps.exec.outputs.sha }}' \
            --arg branch '${{ steps.exec.outputs.branch }}' \
            --arg pr_url '${{ steps.exec.outputs.pr_url }}' \
            --arg pr_number '${{ steps.exec.outputs.pr_number }}' \
            --arg upstream_repo '${{ steps.exec.outputs.upstream_repo }}' \
            '{action:"report",status:"completed",task_id:$task_id,result:{sha:$sha,branch:$branch,pr_url:$pr_url,pr_number:$pr_number,upstream_repo:$upstream_repo}}' \
            > /tmp/report.json
          curl -fsSL \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/report.json \
            https://qhuyoffntxpylelzgbsx.supabase.co/functions/v1/oss-agent-github-worker

      - name: Report failure
        if: steps.task.outputs.has_task == 'true' && failure()
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          jq -n \
            --argjson task_id '${{ steps.task.outputs.task_id }}' \
            '{action:"report",status:"failed",task_id:$task_id,error:"GitHub Actions worker failed; inspect workflow logs."}' \
            > /tmp/report.json
          curl -fsSL \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/report.json \
            https://qhuyoffntxpylelzgbsx.supabase.co/functions/v1/oss-agent-github-worker || true
