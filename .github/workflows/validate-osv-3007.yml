name: Validate OSV 3007

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sbom-purl-version-fallback
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused imodels tests
        run: go test ./internal/imodels
      - name: Full Go tests
        run: go test ./...
